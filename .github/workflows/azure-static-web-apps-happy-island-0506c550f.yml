name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment_name:
        description: 'Azure SWA environment name to close. Azure SWA derives the environment name from the branch name by lower-casing it and replacing non-alphanumeric characters with hyphens (e.g. "copilot/fix-foo" becomes "copilot-fix-foo"). Check the Azure portal Environments tab for the exact name.'
        required: true
        type: string

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    concurrency:
      group: ${{ github.event_name == 'pull_request' && format('azure-swa-pr-{0}', github.event.pull_request.number) || format('azure-swa-{0}', github.ref_name) }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false
      - name: Build And Deploy
        id: builddeploy
        env:
          QUMU_USERNAME: ${{ secrets.QUMU_USERNAME }}
          QUMU_PASSWORD: ${{ secrets.QUMU_PASSWORD }}
          QUMU_API_URL: ${{ secrets.QUMU_API_URL }}
          STOCKQUOTE_API_URL: ${{ secrets.STOCKQUOTE_API_URL }}

          # STOCKQUOTE_API_URL: "https://stockquote-dfhmhnf4bbg0cwck.eastus2-01.azurewebsites.net/mycart-stockquote/getDelayedQuotes"
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_HAPPY_ISLAND_0506C550F }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          action: "upload"
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          app_location: "./staffbase-widget" # App source code path
          api_location: "./staffbase-widget/api" # Api source code path - optional
          output_location: "dist" # Built app content directory - optional
          ###### End of Repository/Build Configurations ######

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_HAPPY_ISLAND_0506C550F }}
          action: "close"

  close_stale_environment_job:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    name: Close Stale Staging Environment
    steps:
      - name: Close Stale Environment
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_HAPPY_ISLAND_0506C550F }}
          action: "close"
          deployment_environment: ${{ inputs.environment_name }}
